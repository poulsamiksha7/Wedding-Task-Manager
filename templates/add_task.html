{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="md-4">➕Add New Task</h2>

        <form action="{{url_for('add_task')}}" method="POST">

            <div class="mb-3">
                <label class="form-label">Task Title</label>
                <input type="text" name="title" class="form-control" placeholder="e.g. Book the venue" required>
            </div>

            <div class="mb-3">
                <label class="from-label">Assigned To</label>
                <input type="text" name="assigned_to" class="form-control" placeholder="e.g. Priya" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="Pending">Pending</option>
                    <option value="DOne">Done</option>
                </select>
            </div>

            <button type="submit" class="btn btn-dark w-100">Add Task</button>
        </form>
    </div>
</div>

{% endblock %}
