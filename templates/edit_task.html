{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">

        <h2 class="mb-4">✏️ Edit Task</h2>

        <form action="{{url_for('edit_task',task_id=task.id)}}" method="POST">

            <div class="mb-3">
                <label class="form-label">Task Title</label>
                <input type="text" name="title" class="form-control" value="{{task.title}}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Assigned To </label>
                <input type="text" name="assigned_to" class="form-control" value="{{task.assigned_to}}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="Pending" {% if task.status=="Pending" %} selected{% endif %}>Pending</option>
                    <option value="Done" {% if task.status=="Done" %}selected{% endif %}>Done</option>
                </select>
            </div>

            <button type="submit" class="btn btn-warning w-100">
                Update Task
            </button>
        </form>

        <a href="{{url_for('tasks')}}" class="btn btn-secondary w-100 mt-2">
            Cancel
        </a>
    </div>
</div>

{% endblock %}
